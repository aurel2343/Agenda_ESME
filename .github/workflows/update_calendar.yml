name: Mettre à jour l'emploi du temps

on:
  workflow_dispatch: # Permet le lancement manuel depuis le téléphone ou le PC
  schedule:
    - cron: '0 6,10,15 * * *' # Mise à jour automatique tous les jours à 8h, 12h et 17h

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Nécessaire pour autoriser le bot à pousser le fichier .ics mis à jour
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install playwright icalendar python-dateutil nest_asyncio
          playwright install chromium

      - name: Lancement du script de scraping
        env:
          ESME_USER: ${{ secrets.ESME_USER }}
          ESME_PASSWORD: ${{ secrets.ESME_PASSWORD }}
        run: python main.py

      - name: Commit et push du nouveau fichier ICS
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add emploi_du_temps.ics
          git diff --staged --quiet || git commit -m "Mise à jour automatique de l'emploi du temps [skip ci]"
          git push
